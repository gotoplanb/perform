<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perform — status</title>
  <link rel="stylesheet" href="/static/status.css">
</head>
<body>
<!--
  The shell only. Everything below #app is rendered by static/status.js from
  GET /status.

  This used to be a server-rendered page with `<meta http-equiv="refresh">`,
  which reloaded the whole document every two seconds — losing scroll position,
  and emitting an access-log line every two seconds forever.

  The rendering lives in one place (the JS) rather than being duplicated in
  Jinja and JS and left to drift. The cost is that this page needs JavaScript;
  for a loopback operator dashboard that is a fair trade, and `/status` serves
  the same data as JSON for anything that can't run it.
-->
<header>
  <h1>perform</h1>
  <span id="conn" class="chip dim">connecting…</span>
  <span id="device" class="chip dim"></span>
  <span id="xruns" class="chip warn" hidden></span>
  <span id="rendered" class="chip dim"></span>
</header>

<noscript>
  <p class="verdict">
    This page renders from <a href="/status">/status</a>, which needs JavaScript.
    That endpoint serves the same data as JSON.
  </p>
</noscript>

<div id="app">
  <p class="verdict" id="verdict">loading…</p>
  <section class="buses" id="buses"></section>
  <section class="sinks" id="sinks" hidden><h2>sinks</h2><table></table></section>
  <section class="warnings" id="warnings" hidden><h2>warnings</h2><ul></ul></section>
</div>

<footer>
  <a href="/surface">surface</a> ·
  <a href="/status">json</a> ·
  <a href="/assets">assets</a> ·
  <a href="/health">health</a>
</footer>

<script src="/static/status.js"></script>
</body>
</html>
